<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타운그리드 · 시안과 실행 화면</title>
<style>body{margin:0;background:#122e32;color:#f1eddf;font:15px system-ui,sans-serif}header{display:flex;gap:20px;align-items:center;padding:20px 24px;border-bottom:1px solid #527571}h1{font-size:19px;margin:0}select{background:#f1eddf;color:#122e32;padding:10px 14px;font:inherit;border:0}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px}figure{margin:0;min-width:0}figcaption{margin-bottom:12px;color:#cadbd1}img{width:100%;height:auto;display:block}a{color:#ffe0a6}p{padding:0 24px;color:#becdc7;line-height:1.7}@media(max-width:900px){main{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}</style>
<header><h1>시안과 실행 화면</h1><select aria-label="비교할 화면"><option value="home">메인 화면</option><option value="components">컴포넌트</option><option value="country">국가 선택</option><option value="plot">부지 선택</option><option value="preview">땅 미리보기</option></select><a href="http://localhost:5173/">게임 열기</a></header>
<main><figure><figcaption id="reference-label">3번 컴포넌트 시안</figcaption><a id="reference-link"><img id="reference" alt="확정 시안"></a></figure><figure><figcaption>현재 실행 화면</figcaption><a id="actual-link"><img id="actual" alt="현재 실행 화면"></a></figure></main>
<p>컴포넌트는 3번 산업 제어반, 배치는 미니멀 시안을 기준으로 합니다. 시작 지도는 선택한 실제 부지의 지형을 표시하므로 시안의 지형 원화와 차이가 있습니다.</p>
<script>
const base='../../../art-source/',component=base+'ui-components/2026-10-03/03-industrial-controls.png',layout=base+'ui-layouts/2026-10-03/';
const views={home:[component,'home.png','3번 컴포넌트 시안'],components:[component,'components.png','3번 컴포넌트 시안'],country:[layout+'start-map-v3/01-country-balanced.png','start/country-1920x1080.png','국가 선택 시안'],plot:[layout+'start-map-v1/02-plot.png','start/plot-1920x1080.png','부지 선택 시안'],preview:[layout+'start-map-v1/03-preview.png','start/preview-1920x1080.png','땅 미리보기 시안']};
function show(key){const [ref,actual,label]=views[key];document.querySelector('#reference').src=ref;document.querySelector('#actual').src=actual;document.querySelector('#reference-link').href=ref;document.querySelector('#actual-link').href=actual;document.querySelector('#reference-label').textContent=label;}
document.querySelector('select').onchange=e=>show(e.target.value);show('home');
</script></html>
