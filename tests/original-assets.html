<!doctype html><html lang="ko"><meta charset="utf-8"><title>ERDYNTH · 원본 에셋 검수</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9e8e0;color:#354b57;font-family:system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:23px;margin:0}button{border:1px solid #98afb5;background:#f8f6ed;color:#354b57;padding:10px 18px;border-radius:6px;cursor:pointer;margin-left:5px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.asset{background:#f7f6ef;border-radius:9px;border:1px solid #d4d8cc;overflow:hidden}.asset canvas{width:100%;display:block}.asset p{margin:0;padding:10px 15px;border-top:1px solid #e1e1d6;font-size:14px}#status{font-size:12px} @media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style><header><h1>ERDYNTH <span style="font-weight:400">· 원본 3D 에셋</span></h1><div><span id="status">준비 중</span><button id="idle">대기</button><button id="walk">걷기</button><button id="carry">운반</button><button id="turn">회전</button></div></header><main></main><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createRenderer} from '/src/app/game/software-renderer.js';
const records=[],loader=new GLTFLoader();let pairs=[['Resident_mira','미라 · 인간 여성'],['Resident_silen','실렌 · 엘프 여성'],['Resident_rowan','로웬 · 인간 남성'],['Resident_marna','마르나 · 드워프 여성'],['Tugboat','예인선'],['PatrolBoat','순찰선'],['Lighthouse','등대'],['Pickaxe','곡괭이']];if(new URLSearchParams(location.search).has('fantasy'))pairs=[['Resident_hana','하나 · 인간 여성'],['Resident_vera','베라 · 티탄 여성'],['Resident_taron','타론 · 티탄 남성'],['Resident_dew','이슬 · 정령'],['Resident_lana','라나 · 켄타로스 여성'],['Resident_kai','카이 · 켄타로스 남성'],['Resident_fia','피아 · 요정 여성'],['Resident_eil','에일 · 요정 남성']];
for(const[name,label]of pairs){const card=document.createElement('section');card.className='asset';const renderer=createRenderer({alpha:true,antialias:true});renderer.setPixelRatio(1.4);renderer.setSize(310,330);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;const p=document.createElement('p');p.textContent=label;card.append(renderer.domElement,p);document.querySelector('main').append(card);const loaded=await loader.loadAsync('/assets/erdynth/'+name+'.glb');const model=loaded.scene;model.name=name;model.userData.asset=name;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);const scene=new THREE.Scene();scene.add(model,new THREE.HemisphereLight('#ffffff','#b3a487',2.4));const sun=new THREE.DirectionalLight('#fff0d8',3);sun.position.set(-3,7,6);scene.add(sun);const span=Math.max(size.y*.60,size.x*.63,size.z*.65),camera=new THREE.OrthographicCamera(-span*.94,span*.94,span,-span,.01,100);camera.position.set(3,name.includes('Resident')?1.1:3.2,7);camera.lookAt(0,0,0);const mixer=new THREE.AnimationMixer(model);let action=loaded.animations.find(c=>c.name==='Idle');if(action)mixer.clipAction(action).play();mixer.update(.18);records.push({renderer,scene,camera,model,mixer,clips:loaded.animations});renderer.render(scene,camera);}
let mode='Idle',angle=0,pose=0;function render(){for(const r of records){r.model.rotation.y=angle;r.renderer.cache?.clear();r.renderer.poseCache?.clear();r.renderer.render(r.scene,r.camera);}document.querySelector('#status').textContent=mode+' · '+pose;}
for(const[id,clip]of[['idle','Idle'],['walk','Walk'],['carry','Walk_Carry']])document.querySelector('#'+id).onclick=()=>{mode=clip;pose++;for(const r of records){r.mixer.stopAllAction();const c=r.clips.find(c=>c.name===clip);if(c){r.mixer.clipAction(c).reset().play();r.mixer.update((pose%6)*c.duration/6);}}render();};document.querySelector('#turn').onclick=()=>{angle+=Math.PI/4;render();};render();
</script></html>
