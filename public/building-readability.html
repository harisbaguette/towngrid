<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>타운그리드 · 건물 가독성 비교</title>
 <style>
  *{box-sizing:border-box}body{margin:0;background:#edf0e6;color:#263d38;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;margin:0}p{color:#64745f;margin:7px 0 22px}a{color:#285c54;white-space:nowrap}fieldset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:0;padding:0;margin:0 0 24px}legend{float:left;margin-right:15px;font-weight:600}button{font:inherit;color:#315b4c;background:#fbfcf6;border:1px solid #acbfa4;border-radius:6px;padding:7px 13px;cursor:pointer}button[aria-pressed=true]{background:#315b4c;color:white}button:focus-visible,a:focus-visible{outline:3px solid #a67c31;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#fbfcf6;border:1px solid #ccd5c4;border-radius:10px;overflow:hidden}h2{font-size:17px;margin:13px 17px}.pair{display:grid;grid-template-columns:1fr 1fr;background:#dbe3c3}.sample{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.sample+ .sample{border-left:1px solid #c6d1b4}img{width:var(--sprite-size,80px);height:var(--sprite-size,80px);image-rendering:pixelated;object-fit:contain}.sample span{font-size:12px;color:#52664b}footer{margin-top:24px;font-size:13px;color:#64745f}@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:21px}header{align-items:flex-start}.sample{min-height:160px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
 </style>
</head>
<body><main>
 <header><h1>건물 가독성 비교</h1><a href="/">게임 열기 ↗</a></header>
 <p>픽셀 화풍과 1×1 정방형 바닥을 유지하면서 잔무늬를 덜고, 시설의 핵심 형태를 키웠습니다.</p>
 <fieldset><legend>표시 크기</legend><button data-size="48" aria-pressed="false">48px</button><button data-size="80" aria-pressed="true">80px</button><button data-size="112" aria-pressed="false">112px</button></fieldset>
 <div class="grid" id="buildings"></div>
 <footer><a href="/production-preview.html">생산 상태별 동작 비교 →</a><br>실제 생산과 운반은 게임 시작 화면의 ‘초반 마을 테스트’에서 확인할 수 있습니다.</footer>
</main>
<script>
 const buildings=[['warehouse','창고'],['house','주민 주택'],['well','우물'],['field','밀밭'],['lumber','벌목장'],['sawmill','제재소']];
 document.querySelector('#buildings').innerHTML=buildings.map(([id,name])=>`<article><h2>${name}</h2><div class="pair"><div class="sample"><img src="/assets/pixel-environment/detailed-v1/${id}-icon.png" alt="${name} 수정 전"><span>수정 전</span></div><div class="sample"><img src="/assets/pixel-environment/${id}-icon.png" alt="${name} 수정 후"><span>수정 후</span></div></div></article>`).join('');
 document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{document.documentElement.style.setProperty('--sprite-size',button.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
</script></body>
</html>
