<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타운그리드 · 지형 8종 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0e5;color:#304c43;font:14px/1.45 system-ui,sans-serif}header{padding:10px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 8px 0 0}button,select{font:inherit;padding:6px 9px;border:1px solid #adbaa4;background:#fffbed;border-radius:5px;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #cfaa45}a{color:#336358}#map{height:calc(100dvh - 240px);min-height:390px;position:relative}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#summary{padding:0 16px 7px;min-height:49px}#summary strong{margin-right:10px}#summary p{margin:2px 0;color:#637564;font-size:12px}#edges{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px 16px}#edges button{text-align:left;display:grid;gap:3px}#edges strong{font-size:14px}#edges span{font-size:12px;color:#637564}#status{margin:0;padding:5px 16px;min-height:30px}footer{padding:0 16px 8px;font-size:11px;color:#657768}@media(max-width:700px){header{padding:8px;gap:5px}h1{width:100%}#map{height:52dvh;min-height:330px}#edges{grid-template-columns:1fr 1fr;padding:7px}#status{font-size:12px}#summary{padding:0 8px 6px}}</style></head>
<body><header><h1>지형 8종 테스트</h1><label>지형 <select id="preset" aria-label="지형 선택"></select></label><button id="left">↶ 90°</button><button id="right">↷ 90°</button><button id="play">생산 시작</button><button id="center">전체 보기</button><label>토질 <select id="overlay"><option value="">기본</option><option value="fertility">비옥도</option><option value="moisture">수분</option><option value="ore">광물량</option><option value="oil">원유 농도</option><option value="mana">마력 농도</option></select></label><a id="renderer" href="?renderer=canvas">CPU 표시</a><a href="/">게임으로</a></header><div id="summary"></div><div id="map"></div><div id="edges"></div><p id="status">지형을 불러오고 있습니다.</p><footer>실제 지역 지형으로 만든 테스트 마을이며 저장하지 않습니다. 시설을 누르면 생산 상태와 재고가 보입니다. Q·E로 회전하고 휠로 확대합니다.</footer>
<script type="module">
import {BUILDINGS} from '/src/app/game/simulation.js';
import {GameScene} from '/src/app/game/scene.js';
import {loadAssets} from '/src/app/game/assets.js';
import {BIOMES} from '/src/app/game/biome-data.js';
import {biomePreview} from '/src/app/game/biome-preview.js';
import {mapEdges,tileLandscape} from '/src/app/game/map-edges.js';
await Promise.all(['human','dwarf','titan'].map(loadAssets));
const params=new URLSearchParams(location.search),status=document.querySelector('#status'),preset=document.querySelector('#preset');
for(const [id,p] of Object.entries(BIOMES)){const option=document.createElement('option');option.value=id;option.textContent=p.name;preset.append(option);}
preset.value=Object.hasOwn(BIOMES,params.get('biome'))?params.get('biome'):'meadow';
function rendererLink(){const alternate=new URLSearchParams(location.search);alternate.set('biome',preset.value);if(params.get('renderer')==='canvas'){alternate.delete('renderer');document.querySelector('#renderer').textContent='WebGL 표시';}else alternate.set('renderer','canvas');document.querySelector('#renderer').href='?'+alternate;}
let selected=null;
const game=new GameScene(document.querySelector('#map'),biomePreview(preset.value),{onClick:(x,z)=>{selected=game.sim.at(x,z)?.id??null;game.select(selected);const t=game.sim.tile(x,z);if(!selected&&t)status.textContent=tileLandscape(game.sim,t).name+' · 비옥도 '+t.fertility+'% · 수분 '+t.moisture+'% · 광물량 '+t.ore+'% · 원유 '+t.oil+'%';},onUpdate:()=>{if(selected){const b=game.sim.buildings.find(b=>b.id===selected);if(b)status.textContent=BUILDINGS[b.type].name+' · '+b.status+' · 생산 '+Math.round(b.progress*100)+'% · 재고 '+b.out;}}},{forceSoftware:params.get('renderer')==='canvas'});
function center(){game.controls.target.set(11.5,0,11.5);game.camera.zoom=.64;game.camera.updateProjectionMatrix();game.setQuarterView(game.viewIndex);}
function reset(){selected=null;game.setSimulation(biomePreview(preset.value));game.setOverlay('');document.querySelector('#overlay').value='';center();document.querySelector('#play').textContent='생산 시작';const p=BIOMES[preset.value],strong=document.createElement('strong'),span=document.createElement('span'),detail=document.createElement('p');strong.textContent=p.name;span.textContent=p.summary;detail.textContent=p.detail;document.querySelector('#summary').replaceChildren(strong,span,detail);document.querySelector('#edges').replaceChildren(...mapEdges(game.sim.layout).map(edge=>{const button=document.createElement('button');button.dataset.side=edge.side;const strong=document.createElement('strong'),span=document.createElement('span');strong.textContent=edge.direction+' · '+edge.name;span.textContent=edge.short;button.append(strong,span);button.onclick=()=>{game.focusEdge(edge.side);game.setOverlay(edge.overlay||'');document.querySelector('#overlay').value=edge.overlay||'';status.textContent=edge.detail;};return button;}));status.textContent='생산 시작을 누르면 주민이 일하고 생산품을 운반합니다.';const next=new URL(location);next.searchParams.set('biome',preset.value);history.replaceState(null,'',next);rendererLink();}
preset.onchange=reset;document.querySelector('#left').onclick=()=>game.rotate(-1);document.querySelector('#right').onclick=()=>game.rotate(1);document.querySelector('#center').onclick=center;document.querySelector('#overlay').onchange=e=>game.setOverlay(e.target.value);
document.querySelector('#play').onclick=e=>{game.sim.paused=!game.sim.paused;e.target.textContent=game.sim.paused?'생산 시작':'일시정지';};
addEventListener('keydown',e=>{if(/select|input/i.test(e.target.tagName))return;if(e.key.toLowerCase()==='q')game.rotate(-1);if(e.key.toLowerCase()==='e')game.rotate(1);});
reset();window.biomePreview={game,reset,center};
</script><script type="module" src="/preview-audio.js"></script>
</body></html>
