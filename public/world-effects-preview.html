<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타운그리드 · 환경·효과 컴포넌트</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#c7d6bd;color:#eff6da;font:14px/1.45 system-ui,sans-serif}header{position:relative;z-index:2;background:#123f43;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:3px solid #86a691}h1{font-size:17px;margin:0 auto 0 0}select,button,a{font:inherit}button,select{min-height:38px;border:1px solid #789d91;border-radius:3px;background:#f4f2db;color:#173f40;padding:6px 10px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f5bc51;outline-offset:2px}a{color:#eff6da}main{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}aside{position:absolute;left:16px;bottom:16px;max-width:min(480px,calc(100% - 32px));padding:12px 16px;background:#153f40ec;border:2px solid #729587;border-radius:5px;pointer-events:none}aside p{margin:4px 0 0;font-size:12px;color:#d2dfbd}#actions{position:absolute;left:16px;top:16px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 32px)}#actions:empty{display:none}#actions button{background:#eaa72b;color:#153f40}header label{display:flex;align-items:center;gap:5px}@media(max-width:700px){header{padding:8px;gap:6px}h1{width:100%;font-size:16px}header label{font-size:12px}button,select{max-width:180px;padding:5px 8px}aside{left:10px;bottom:10px;max-width:calc(100% - 20px);padding:8px 12px}}
</style></head><body>
<header><h1>환경·효과 컴포넌트</h1><label>종류 <select id="effect" aria-label="효과 선택"></select></label><label>지형 <select id="biome" aria-label="지형 선택"></select></label><button id="rotate">↻ 90°</button><button id="pause">동작 멈추기</button><a id="renderer" href="?renderer=canvas">Canvas 비교</a><a href="/">게임으로</a></header>
<main><div id="map"></div><div id="actions"></div><aside><strong id="name">불러오는 중</strong><p id="description"></p><p>저장하지 않는 상태 미리보기 · 드래그 이동 / 휠 확대</p></aside></main>
<script type="module" src="/src/app/game/world-effects-preview.js"></script><script type="module" src="/preview-audio.js"></script>
</body></html>
