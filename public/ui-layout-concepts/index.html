<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타운그리드 · 미니멀 UI 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1e9;color:#193f42;font:15px/1.6 "Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:1500px;margin:auto;padding:28px 24px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:20px}
h1{font-size:23px;letter-spacing:-.7px;line-height:1.3;margin:0 0 6px}p{margin:0;color:#52665f;font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;border:0;border-radius:3px;background:#e4e7df;color:#193f42;padding:9px 17px;cursor:pointer;white-space:nowrap;font-size:14px}
button:hover{background:#d3dcd4}button[aria-pressed=true]{background:#193f42;color:#fff7e8}
button:focus-visible,a:focus-visible{outline:3px solid #ee701b;outline-offset:3px}
figure{margin:0}figure img{display:block;width:100%;height:auto;border-radius:3px;background:#93a960}
figcaption{display:flex;justify-content:space-between;gap:20px;margin:12px 0 0;align-items:start;font-size:13px;color:#52665f}
a{color:#235f63;text-underline-offset:3px;white-space:nowrap}
.notes{display:flex;gap:36px;flex-wrap:wrap;border-top:1px solid #ccd3c9;margin-top:24px;padding-top:17px}
.notes p{max-width:320px;font-size:13px}.notes strong{color:#193f42;display:block;margin-bottom:2px}
footer{margin-top:20px;font-size:12px;color:#64746b;display:flex;justify-content:space-between;gap:16px}
@media(max-width:800px){main{padding:20px 12px}header{align-items:start;flex-direction:column;gap:16px}h1{font-size:21px}button{padding:8px 14px}.notes{gap:14px}.notes p{max-width:none;width:100%}figcaption{gap:12px}}
</style>
</head>
<body>
<main>
<header><div><h1>타운그리드 · 미니멀 UI</h1><p>같은 배치의 기본·건설·시설 선택 상태입니다.</p></div><nav aria-label="화면 상태"></nav></header>
<figure><img id="preview" src="minimal-v2/01-default.png" width="1672" height="941" alt="미니멀 기본 화면"><figcaption><span id="description">자원 3개 · 시간 조절 · 시장/건설/세계</span><a id="original" href="minimal-v2/01-default.png" target="_blank" rel="noopener">크게 보기 ↗</a></figcaption></figure>
<div class="notes">
<p><strong>기본 조작만 보이게</strong>자원은 3개만 표시하고 나머지는 펼쳐 봅니다. 시간은 현재 배속만 표시합니다.</p>
<p><strong>작업창은 하나씩</strong>건설 목록과 시설 정보가 같은 하단 영역을 사용합니다. 닫으면 기본 메뉴로 돌아갑니다.</p>
<p><strong>상세 정보는 필요한 때</strong>목표·납품·주민·설정은 메뉴에서 열고, 카메라는 드래그·휠·Q/E로 조작합니다.</p>
</div>
<footer><span>배치 검토용 이미지 시안</span><a href="full-layouts.html">이전 배치 보기</a></footer>
</main>
<script>
const states=[{"id":"01","name":"기본 화면","file":"01-default.png","description":"자원 3개 · 시간 조절 · 시장/건설/세계"},{"id":"02","name":"건설 중","file":"02-building.png","description":"건설을 누르면 하단 메뉴가 작은 건물 목록으로 바뀝니다."},{"id":"03","name":"시설 선택","file":"03-facility.png","description":"시설을 누르면 하단에 생산 상태와 조작만 표시합니다."}];
let active=0;const nav=document.querySelector('nav');
states.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=s.name;b.onclick=()=>select(i);b.setAttribute('aria-pressed','false');nav.append(b);});
function select(i){active=i;const s=states[i],file='minimal-v2/'+s.file;document.getElementById('preview').src=file;document.getElementById('preview').alt='미니멀 '+s.name;document.getElementById('description').textContent=s.description;document.getElementById('original').href=file;nav.querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));history.replaceState(null,'','#'+s.id);}
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.altKey||e.ctrlKey||e.metaKey)return;e.preventDefault();select((active+(e.key==='ArrowRight'?1:states.length-1))%states.length);});
const initial=states.findIndex(s=>s.id===location.hash.slice(1));select(initial<0?0:initial);
</script>
</body>
</html>
